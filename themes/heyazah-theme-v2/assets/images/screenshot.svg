<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#082b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#025157;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Header -->
  <rect width="1200" height="100" fill="url(#headerGrad)"/>
  <text x="30" y="65" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#d1ccbd">Heyazah Pro</text>
  
  <!-- Hero Section -->
  <rect y="100" width="1200" height="300" fill="#082b2a"/>
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">رواد التطوير العقاري</text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="24" fill="#d1ccbd" text-anchor="middle">Heyazah Real Estate Theme</text>
  
  <!-- Content Section 1 -->
  <rect y="400" width="1200" height="200" fill="#ffffff" stroke="#d1ccbd" stroke-width="2"/>
  <text x="50" y="450" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#025157">مشاريعنا</text>
  <rect x="50" y="480" width="250" height="100" fill="#f5f5f5" stroke="#d1ccbd" stroke-width="1" rx="8"/>
  <rect x="325" y="480" width="250" height="100" fill="#f5f5f5" stroke="#d1ccbd" stroke-width="1" rx="8"/>
  <rect x="600" y="480" width="250" height="100" fill="#f5f5f5" stroke="#d1ccbd" stroke-width="1" rx="8"/>
  <rect x="875" y="480" width="275" height="100" fill="#f5f5f5" stroke="#d1ccbd" stroke-width="1" rx="8"/>
  
  <!-- Footer -->
  <rect y="800" width="1200" height="100" fill="#082b2a"/>
  <text x="50" y="835" font-family="Arial, sans-serif" font-size="14" fill="#d1ccbd">Heyazah Pro - Professional Real Estate Theme for WordPress</text>
  <text x="50" y="860" font-family="Arial, sans-serif" font-size="12" fill="#99856a">Version 2.0 | Full RTL Support | Block Theme</text>
  
  <!-- Decorative Elements -->
  <circle cx="1150" cy="50" r="30" fill="#99856a" opacity="0.3"/>
  <circle cx="1100" cy="80" r="20" fill="#99856a" opacity="0.2"/>
</svg>
